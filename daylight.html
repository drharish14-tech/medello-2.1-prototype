<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EAF1EA">
  <title>Medello · Daylight</title>
  <meta name="description" content="Medello Daylight prototype — center AI orb, Hold to take, sparkles on each medicine. Not the Patient & Family 5-tab.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="daylight.css">
</head>
<body>
  <div class="stage">
    <p class="stage-note"><strong>Medello · Daylight</strong> — old AI-prominent look, craft-polished. Sample day only.</p>
    <div class="phone" id="phone">
      <div class="island" aria-hidden="true"></div>
      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="status-icons">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="#28362F"><rect x="0" y="7" width="3" height="5" rx="0.6"/><rect x="4.5" y="5" width="3" height="7" rx="0.6"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.6"/><rect x="13.5" y="0" width="3" height="12" rx="0.6"/></svg>
          <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="#28362F" stroke-width="1.6" stroke-linecap="round"><path d="M1 4.5c3.5-3.2 9.5-3.2 13 0"/><path d="M3.2 7c2.2-2 6.4-2 8.6 0"/><path d="M5.6 9.4c1-1 2.8-1 3.8 0"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.6" y="0.6" width="21" height="10.8" rx="2.2" fill="none" stroke="#28362F" stroke-width="1.2"/><rect x="2" y="2" width="16" height="8" rx="1" fill="#28362F"/><rect x="22.4" y="3.6" width="1.6" height="4.8" rx="0.5" fill="#28362F"/></svg>
        </span>
      </div>
      <main class="screen" id="screen"></main>
      <button class="fab" id="fab" type="button" data-act="add" aria-label="Add a medicine">+</button>
      <nav class="tabbar" aria-label="Primary">
        <button class="tab" type="button" data-act="tab" data-arg="today" id="tab-today"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg><span>Today</span></button>
        <button class="tab" type="button" data-act="tab" data-arg="meds" id="tab-meds"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 1 1 7-7l7 7a4.95 4.95 0 1 1-7 7z"/><path d="M7 10l7 7"/></svg><span>Meds</span></button>
        <div class="orb-slot">
          <button class="orb" type="button" data-act="ask" data-arg="" aria-label="Ask Medello">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#fff" d="M12 2.4 13.5 8a2.6 2.6 0 0 0 1.7 1.7L21 11.2l-5.8 1.5a2.6 2.6 0 0 0-1.7 1.7L12 20.2l-1.5-5.8a2.6 2.6 0 0 0-1.7-1.7L3 11.2 8.8 9.7A2.6 2.6 0 0 0 10.5 8L12 2.4z"/>
              <path fill="#fff" d="M18.2 14.2 18.8 16l1.8.6-1.8.6-.6 1.8-.6-1.8-1.8-.6 1.8-.6.6-1.8z"/>
            </svg>
          </button>
        </div>
        <button class="tab" type="button" data-act="tab" data-arg="progress" id="tab-progress"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 6-8"/><path d="M14 6h6v6"/></svg><span>Progress</span></button>
        <button class="tab" type="button" data-act="tab" data-arg="settings" id="tab-settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.3.6.9 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
      </nav>
      <div class="home-ind" aria-hidden="true"></div>
      <div class="scrim" id="scrim" hidden></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
      <div class="overlay" id="overlay" hidden></div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
  </div>
  <script src="daylight.js"></script>
</body>
</html>
